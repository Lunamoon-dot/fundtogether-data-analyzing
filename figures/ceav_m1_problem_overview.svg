<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">FundTogether milestone verification problem</title>
  <desc id="desc">A workflow from backers through escrow and milestone evidence to judge review and release or refund, with four strategic risks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#274c77"/></marker>
    <style>
      .bg{fill:#f7fafc}.title{font:700 30px Arial,sans-serif;fill:#16324f}.sub{font:400 16px Arial,sans-serif;fill:#476072}.box{fill:#fff;stroke:#274c77;stroke-width:2}.boxtext{font:700 18px Arial,sans-serif;fill:#16324f}.small{font:400 15px Arial,sans-serif;fill:#334e68}.risk{fill:#fff4e6;stroke:#d97706;stroke-width:2}.riskhead{font:700 17px Arial,sans-serif;fill:#9a4d00}.risktext{font:400 15px Arial,sans-serif;fill:#6b3b08}.line{stroke:#274c77;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="60" y="58">FundTogether: why milestone verification is a research problem</text>
  <text class="sub" x="60" y="88">The mechanism must protect escrow funds while inducing useful, unbiased review effort.</text>

  <rect class="box" x="70" y="150" width="190" height="105" rx="14"/><text class="boxtext" x="165" y="190" text-anchor="middle">Backers</text><text class="small" x="165" y="218" text-anchor="middle">contribute funds</text>
  <rect class="box" x="335" y="150" width="190" height="105" rx="14"/><text class="boxtext" x="430" y="190" text-anchor="middle">Escrow</text><text class="small" x="430" y="218" text-anchor="middle">holds payout</text>
  <rect class="box" x="600" y="150" width="220" height="105" rx="14"/><text class="boxtext" x="710" y="190" text-anchor="middle">Creator milestone</text><text class="small" x="710" y="218" text-anchor="middle">submits evidence</text>
  <rect class="box" x="895" y="150" width="220" height="105" rx="14"/><text class="boxtext" x="1005" y="190" text-anchor="middle">Judges review</text><text class="small" x="1005" y="218" text-anchor="middle">reports and decision</text>
  <path class="line" d="M260 202 L335 202"/><path class="line" d="M525 202 L600 202"/><path class="line" d="M820 202 L895 202"/>

  <path class="line" d="M1005 255 L1005 335"/>
  <rect class="box" x="840" y="350" width="330" height="105" rx="14"/><text class="boxtext" x="1005" y="390" text-anchor="middle">Final outcome</text><text class="small" x="1005" y="418" text-anchor="middle">release funds / reject / refund</text>

  <rect class="risk" x="70" y="365" width="300" height="150" rx="14"/><text class="riskhead" x="95" y="405">Decision error</text><text class="risktext" x="95" y="434">wrong release creates false payout</text><text class="risktext" x="95" y="459">or false rejection</text>
  <rect class="risk" x="400" y="365" width="300" height="150" rx="14"/><text class="riskhead" x="425" y="405">Reviewer behavior</text><text class="risktext" x="425" y="434">low effort or biased reports</text><text class="risktext" x="425" y="459">can reduce decision quality</text>
  <rect class="risk" x="70" y="545" width="300" height="100" rx="14"/><text class="riskhead" x="95" y="582">Audit exposure</text><text class="risktext" x="95" y="611">more checking raises cost</text>
  <rect class="risk" x="400" y="545" width="300" height="100" rx="14"/><text class="riskhead" x="425" y="582">Bad incentives</text><text class="risktext" x="425" y="611">strategic reports or audit seeking</text>
  <path class="line" d="M700 415 L840 390"/><path class="line" d="M550 545 L550 515"/>
  <text class="sub" x="840" y="540">Research question: can effort, reporting,</text><text class="sub" x="840" y="566">quality and budget constraints hold together?</text>
</svg>
